<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Our Library</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: #172033
    }

    .card {
      width: min(420px, 92vw);
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 55px #0f172a12
    }

    .brand {
      font-size: 30px;
      margin-bottom: 8px
    }

    .muted {
      color: #64748b;
      margin: 0 0 24px
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 7px
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px
    }

    button {
      margin-top: 22px;
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      font-size: 15px
    }

    .alert {
      padding: 11px 12px;
      border-radius: 8px;
      margin: 14px 0;
      background: #fee2e2;
      color: #991b1b
    }

    .success {
      background: #dcfce7;
      color: #166534
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 18px;
      line-height: 1.5
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">📚 Our Library</div>
    <h1>Admin Login</h1>
    <p class="muted">Sign in to manage your library.</p>
    <div id="message"></div>
    <form id="loginForm" method="post" action="/login"><label for="username">Admin email</label><input id="username"
        name="username" type="email" autocomplete="username" required placeholder="admin@library.com"><label
        for="password">Password</label><input id="password" name="password" type="password"
        autocomplete="current-password" required placeholder="Enter password"><button type="submit">Sign in</button>
    </form>
    <p class="hint">For security, use your configured admin credentials. Set LIBRARY_ADMIN_EMAIL and
      LIBRARY_ADMIN_PASSWORD before using this app beyond local testing.</p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const box = document.getElementById('message');
    if (q.has('error')) box.innerHTML = '<div class="alert">Invalid email or password. Please try again.</div>';
    if (q.has('logout')) box.innerHTML = '<div class="alert success">You have been logged out successfully.</div>';
    function readCookie(name) {
      const prefix = name + '=';
      const item = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix));
      return item ? decodeURIComponent(item.substring(prefix.length)) : null;
    }
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true; button.textContent = 'Signing in…';
      try {
        await fetch('/csrf', { credentials: 'same-origin' });
        const token = readCookie('XSRF-TOKEN');
        if (!token) throw new Error('Security token was not created. Refresh and try again.');
        const response = await fetch('/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRF-TOKEN': token },
          body: new URLSearchParams(new FormData(form))
        });
        if (response.redirected && response.url.includes('error=true')) {
          box.innerHTML = '<div class="alert">Invalid email or password. Please try again.</div>'; return;
        }
        if (response.ok || response.redirected) { window.location.assign('/'); return; }
        throw new Error('Sign-in failed. Please try again.');
      } catch (error) { box.innerHTML = '<div class="alert">' + error.message + '</div>'; }
      finally { button.disabled = false; button.textContent = 'Sign in'; }
    });
  </script>
</body>

</html>
